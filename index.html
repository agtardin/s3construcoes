<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>S3 Construções</title>
  <link href="https://fonts.googleapis.com/css2?family=Hanson:wght@700&family=Source+Code+Pro:wght@400&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #30332f;
      --bg-dark: #1a1c19;
      --red: #a00808;
      --red-light: #c41010;
      --fg: #f0ece4;
      --muted: #888780;
      --muted-light: #b4b2a9;
    }

    body {
      background: var(--bg-dark);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Textura sutil */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(160,8,8,0.015) 2px,
          rgba(160,8,8,0.015) 4px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* Glow vermelho sutil no topo */
    body::after {
      content: '';
      position: fixed;
      top: -250px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 500px;
      background: radial-gradient(ellipse, rgba(160,8,8,0.12) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      animation: fadeUp 1s ease both;
    }

    /* Logo */
    .logo-wrap {
      margin-bottom: 3rem;
      display: flex;
      justify-content: center;
      animation: fadeUp 1s ease 0.1s both;
    }

    .logo-wrap img {
      width: 280px;
      max-width: 80vw;
      height: auto;
      filter: drop-shadow(0 4px 24px rgba(160,8,8,0.25));
    }

    /* Linha divisória */
    .divider {
      width: 60px;
      height: 2px;
      background: var(--red);
      margin: 2rem auto;
      animation: expandWidth 1s ease 0.5s both;
    }

    @keyframes expandWidth {
      from { width: 0; opacity: 0; }
      to { width: 60px; opacity: 1; }
    }

    /* Tagline */
    .tagline {
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--muted-light);
      animation: fadeUp 1s ease 0.65s both;
      line-height: 2;
    }

    .tagline strong {
      color: var(--red);
      font-weight: 500;
    }

    /* Linha separadora entre áreas */
    .areas {
      margin-top: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      animation: fadeUp 1s ease 0.8s both;
    }

    .area-item {
      font-size: 0.62rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 300;
    }

    .area-sep {
      width: 1px;
      height: 14px;
      background: var(--red);
      opacity: 0.5;
    }

    /* Domínio */
    .domain {
      margin-top: 3rem;
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      color: var(--muted);
      text-transform: lowercase;
      animation: fadeUp 1s ease 0.95s both;
    }

    .domain span {
      color: var(--red);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Borda inferior */
    .bottom-line {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--red), transparent);
      animation: shimmer 3s ease-in-out infinite;
    }

    /* Borda superior */
    .top-line {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(160,8,8,0.5), transparent);
    }

    @keyframes shimmer {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* Blocos de canto decorativos */
    .corner {
      position: fixed;
      width: 32px;
      height: 32px;
    }
    .corner-tl { top: 16px; left: 16px; border-top: 1px solid rgba(160,8,8,0.4); border-left: 1px solid rgba(160,8,8,0.4); }
    .corner-tr { top: 16px; right: 16px; border-top: 1px solid rgba(160,8,8,0.4); border-right: 1px solid rgba(160,8,8,0.4); }
    .corner-bl { bottom: 16px; left: 16px; border-bottom: 1px solid rgba(160,8,8,0.4); border-left: 1px solid rgba(160,8,8,0.4); }
    .corner-br { bottom: 16px; right: 16px; border-bottom: 1px solid rgba(160,8,8,0.4); border-right: 1px solid rgba(160,8,8,0.4); }
  </style>
</head>
